name: Build beIN Cast Root Prototype

on:
  push:
    branches: [main]
    paths: ['zygisk/**', '.github/workflows/root-module.yml']
  pull_request:
    paths: ['zygisk/**', '.github/workflows/root-module.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bein-cast-root-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build and check ARM32 and ARM64 root-module payloads
        run: bash zygisk/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: beIN-Cast-Root-v6-prototype
          path: zygisk/dist/beIN-Cast-Root-v6-prototype.zip
          if-no-files-found: error
