name: Build beIN Cast Fix

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk beIN-Cast-Fix-v3-modern-inert.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: beIN-Cast-Fix-v3-modern-inert
          path: beIN-Cast-Fix-v3-modern-inert.apk
          if-no-files-found: error
